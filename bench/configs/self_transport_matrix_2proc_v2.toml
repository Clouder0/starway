[campaign]
id = "self_transport_matrix_2proc_v2"
results_dir = "results"

# Repeat points to stabilize medians/percentiles.
repeats = 3
seed = 42

[execution]
mode = "self"
topology = "two_process"

# Safety valves.
point_timeout_s = 60.0
close_timeout_s = 5.0

[[comparators]]
name = "asyncio_tcp"
type = "asyncio_tcp"

[comparators.options]
tcp_nodelay = true

[[comparators]]
name = "ucx_tcp"
type = "starway_ucx"

[comparators.env]
UCX_TLS = "tcp"

[[comparators]]
name = "ucx_sm"
type = "starway_ucx"

[comparators.env]
UCX_TLS = "sm"

[[comparators]]
name = "shm_py"
type = "shm_py"

[comparators.options]
shm_target_bytes = "64MiB"
shm_min_slots = 4
shm_max_slots = 65536
spin_yield_every = 1024

[[workloads]]
name = "control_rtt"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384, 65536, 262144, 1048576]
warmup_iters = [200]
iters = [2000]

[[workloads]]
name = "small_message_pressure"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384]
inflight = [64]
ack_every_n = [256]
duration_s = [2.0]

[[workloads]]
name = "bulk_stream"

# Curated point list to avoid full cross-products and ensure each inflight has
# multiple chunk sizes.
[[workloads.points]]
chunk_bytes = "64KiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "256KiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "1MiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "4MiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "16MiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "64KiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "256KiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "1MiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "4MiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "64KiB"
inflight = 64
ack_every_n = 64
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "256KiB"
inflight = 64
ack_every_n = 64
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "1MiB"
inflight = 64
ack_every_n = 64
duration_s = 2.0

[[workloads]]
name = "mixed_size"

[[workloads.points]]
sizes = ["64B", "1KiB", "64KiB"]
inflight = 64
ack_every_n = 256
duration_s = 2.0

[[workloads.points]]
sizes = ["1KiB", "64KiB", "1MiB"]
inflight = 64
ack_every_n = 256
duration_s = 2.0

[[workloads]]
name = "bucket_duplex_step"

[workloads.matrix]
bucket_bytes = ["64KiB", "256KiB", "1MiB", "4MiB", "16MiB"]
buckets_per_step = [8]
steps = [5]

[[workloads]]
name = "control_under_load"

[[workloads.points]]
[workloads.points.control]
msg_bytes = 64
warmup_iters = 200
iters = 2000

[workloads.points.bulk]
chunk_bytes = "4MiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0
