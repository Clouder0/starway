[campaign]
id = "cluster_transport_matrix_2host_all_v1"
results_dir = "results"
repeats = 1
seed = 42

[execution]
mode = "cluster"
topology = "two_process"

# Safety valves (cluster runs can be slower than localhost self-mode).
point_timeout_s = 120.0
close_timeout_s = 5.0

[cluster]
# Bind on the coordinator host. Use an explicit IPv4 or 0.0.0.0.
coordinator_bind_host = "0.0.0.0"
coordinator_port = 5001

server_agent_id = "hostA"
client_agent_id = "hostB"

# Open this inbound port range on the *server* host (hostA).
port_range_min = 20000
port_range_max = 25000

agent_connect_timeout_s = 15.0
agent_rpc_timeout_s = 10.0

[[comparators]]
name = "asyncio_tcp"
type = "asyncio_tcp"

[comparators.options]
tcp_nodelay = true

[[comparators]]
name = "ucx_tcp"
type = "starway_tcp"

[comparators.env]
UCX_TLS = "tcp"

[[comparators]]
name = "ucx_rdma"
type = "starway_tcp"

[comparators.env]
# Note: exact UCX RDMA configuration is environment-specific.
# Keep this as a starting point and override per-host as needed.
UCX_TLS = "rc,tcp"

[[workloads]]
name = "control_rtt"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384, 65536, 262144, 1048576]
warmup_iters = [200]
iters = [2000]

[[workloads]]
name = "small_message_pressure"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384, 65536]
inflight = [64]
ack_every_n = [64]
duration_s = [2.0]

[[workloads]]
name = "bulk_stream"

[[workloads.points]]
chunk_bytes = "64KiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "256KiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0

[[workloads.points]]
