[campaign]
id = "self_ucx_tcp_vs_asyncio_bulk_debug_v1"
results_dir = "results"
repeats = 1
seed = 42

[execution]
mode = "self"
topology = "two_process"
point_timeout_s = 60.0
close_timeout_s = 5.0

[[comparators]]
name = "asyncio_tcp"
type = "asyncio_tcp"

[comparators.options]
tcp_nodelay = true

[[comparators]]
name = "ucx_tcp"
type = "starway_ucx"

[comparators.env]
UCX_TLS = "tcp"

[[comparators]]
name = "ucx_tcp_lo"
type = "starway_ucx"

[comparators.env]
UCX_TLS = "tcp"
UCX_NET_DEVICES = "lo"

[[workloads]]
name = "bulk_stream"

[[workloads.points]]
chunk_bytes = "64KiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "1MiB"
inflight = 16
ack_every_n = 16
duration_s = 2.0

[[workloads.points]]
chunk_bytes = "16MiB"
inflight = 4
ack_every_n = 4
duration_s = 2.0
