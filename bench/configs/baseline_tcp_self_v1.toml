[campaign]
id = "baseline_tcp_self_v1"
results_dir = "results"
repeats = 1
seed = 42

[execution]
mode = "self"

# Safety valves for MVP runs.
point_timeout_s = 60.0
close_timeout_s = 5.0

[[comparators]]
name = "asyncio_tcp"
type = "asyncio_tcp"

[comparators.options]
tcp_nodelay = true

[[comparators]]
name = "starway_tcp"
type = "starway_tcp"

[comparators.env]
UCX_TLS = "tcp"

[[workloads]]
name = "control_rtt"

[workloads.matrix]
msg_bytes = [64, 1024]
warmup_iters = [200]
iters = [2000]

[[workloads]]
name = "small_message_pressure"

[workloads.matrix]
msg_bytes = [1024]
inflight = [64]
ack_every_n = [256]
duration_s = [2.0]

[[workloads]]
name = "bulk_stream"

[workloads.matrix]
chunk_bytes = ["4MiB"]
inflight = [16]
ack_every_n = [32]
duration_s = [2.0]

[[workloads]]
name = "mixed_size"

[[workloads.points]]
sizes = ["64B", "1KiB", "64KiB"]
inflight = 64
ack_every_n = 256
duration_s = 2.0

[[workloads]]
name = "bucket_duplex_step"

[workloads.matrix]
bucket_bytes = ["4MiB"]
buckets_per_step = [8]
steps = [5]

[[workloads]]
name = "control_under_load"

[[workloads.points]]
[workloads.points.control]
msg_bytes = 64
warmup_iters = 200
iters = 2000

[workloads.points.bulk]
chunk_bytes = "4MiB"
inflight = 16
ack_every_n = 32
duration_s = 2.0
