[campaign]
# Out-of-the-box 2-host cluster run focusing on UCX/TCP default vs tuned.
id = "cluster_ucx_tcp_oob_v1"
results_dir = "results"
repeats = 1
seed = 42

[execution]
mode = "cluster"
topology = "two_process"

# Cluster runs are usually slower than localhost.
point_timeout_s = 180.0
close_timeout_s = 5.0

[cluster]
coordinator_bind_host = "0.0.0.0"
coordinator_port = 5001

server_agent_id = "hostA"
client_agent_id = "hostB"

# Open this inbound port range on the *server* host (hostA).
port_range_min = 20000
port_range_max = 25000

agent_connect_timeout_s = 60.0
agent_rpc_timeout_s = 20.0

[[comparators]]
name = "asyncio_tcp"
type = "asyncio_tcp"

[comparators.options]
tcp_nodelay = true

[[comparators]]
name = "ucx_tcp_default"
type = "starway_tcp"

[comparators.env]
UCX_TLS = "tcp"

[comparators.options]
# Endpoint discovery polls server.list_clients(); on noisy clusters this can take longer.
accept_timeout_s = 15.0

[[comparators]]
name = "ucx_tcp_tuned"
type = "starway_tcp"

[comparators.env]
UCX_TLS = "tcp"
UCX_TCP_TX_SEG_SIZE = "256K"
UCX_TCP_RX_SEG_SIZE = "256K"

[comparators.options]
accept_timeout_s = 15.0

# Optional: RDMA (environment-specific). Enable only if your cluster has RDMA.
#
# [[comparators]]
# name = "ucx_rdma"
# type = "starway_tcp"
#
# [comparators.env]
# UCX_TLS = "rc,tcp"
#
# [comparators.options]
# accept_timeout_s = 15.0

[[workloads]]
name = "control_rtt"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384, 65536, 262144, 1048576]
warmup_iters = [200]
iters = [2000]

[[workloads]]
name = "small_message_pressure"

[workloads.matrix]
msg_bytes = [64, 256, 1024, 4096, 16384, 65536]
inflight = [64]
ack_every_n = [64]
duration_s = [2.0]

